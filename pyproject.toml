[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-mcp"
version = "1.0.0"
description = "Context Layer for Local Codebases over Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RepoLens Contributors" }
]
dependencies = [
    "fastmcp>=3.0.0",
    "chromadb>=0.5.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages",
    "tree-sitter-python>=0.23.0",
    "GitPython>=3.1.40",
    "sentence-transformers>=3.0.0",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]

[project.scripts]
repolens-mcp = "src.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
